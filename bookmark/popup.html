<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>书签</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <main class="app">
    <header class="header">
      <h1>书签</h1>
    </header>

    <section class="search-wrap" role="search">
      <div class="search-input-container">
        <button id="search-button" class="search-icon-btn" type="button" aria-label="搜索">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <circle cx="11" cy="11" r="8"/>
            <line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
        </button>
        <input
          id="search-input"
          type="search"
          placeholder="搜索书签标题或网址..."
          autocomplete="off"
          autofocus
        />
      </div>
    </section>

    <section class="list-card" aria-label="书签列表">
      <section id="bookmark-list" class="bookmark-list"></section>

      <section id="empty-state" class="empty-state" hidden>
        <div class="empty-icon">☆</div>
        <p>没有找到匹配的书签</p>
      </section>
    </section>

    <footer class="footer">
      <p id="count-text">加载中...</p>
    </footer>
  </main>

  <script src="popup.js"></script>
</body>
</html>
